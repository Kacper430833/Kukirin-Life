<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kukirin Life Demo</title>
  <style>
    :root{
      --bg:#0a1220;
      --panel:rgba(15,23,42,0.92);
      --panel-2:rgba(30,41,59,0.9);
      --line:rgba(148,163,184,0.22);
      --text:#e2e8f0;
      --muted:#a5b4cf;
      --cyan:#38bdf8;
      --yellow:#facc15;
      --green:#4ade80;
      --red:#f87171;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#020817;
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      overflow:hidden;
    }
    body{
      display:flex;
      gap:14px;
      padding:14px;
    }

    .sidebar{
      width:350px;
      min-width:350px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.28);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .brand{
      font-size:30px;
      font-weight:900;
      color:var(--yellow);
      text-transform:uppercase;
      letter-spacing:1px;
      text-align:center;
      margin-bottom:4px;
      text-shadow:0 0 14px rgba(250,204,21,0.22);
    }

    .status-box{
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      line-height:1.7;
      font-size:14px;
    }

    .panel-title{
      font-size:15px;
      font-weight:800;
      color:var(--cyan);
      letter-spacing:1px;
      text-transform:uppercase;
      margin:0 0 8px;
    }

    .shop, .garage{
      background:var(--panel-2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:300px;
      overflow-y:auto;
    }

    .vehicle-item{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(15,23,42,0.8);
      padding:8px 10px;
    }

    .vehicle-name{
      font-weight:700;
      font-size:13px;
    }

    .vehicle-meta{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
    }

    .vehicle-price{
      color:var(--yellow);
      font-weight:700;
      font-size:12px;
      white-space:nowrap;
    }

    button{
      background:linear-gradient(180deg, #38bdf8, #2563eb);
      border:none;
      color:white;
      font-weight:700;
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
      min-width:72px;
      font-size:12px;
    }
    button:hover{filter:brightness(1.08)}
    button.secondary{background:linear-gradient(180deg, #4ade80, #16a34a)}
    button:disabled{opacity:0.8;cursor:default}

    .viewport{
      position:relative;
      flex:1;
      background:#000;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,.32);
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
    }

    .message{
      position:absolute;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(15,23,42,0.7);
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 16px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.5px;
      z-index:10;
    }

    .hint{
      position:absolute;
      left:12px;
      bottom:12px;
      background:rgba(2,6,23,0.72);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 10px;
      font-size:12px;
      z-index:10;
    }

    @media (max-width:1080px){
      body{flex-direction:column}
      .sidebar{width:100%;min-width:unset}
      .viewport{min-height:60vh}
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">Kukirin Life</div>

    <div class="status-box">
      <div><strong>Budżet:</strong> <span id="money">500 zł</span></div>
      <div><strong>Hulajnoga:</strong> <span id="currentVehicle">Kukirin S1 Pro</span></div>
      <div><strong>Tryb:</strong> <span id="mode">Pieszo</span></div>
      <div><strong>Prędkość:</strong> <span id="speed">0 km/h</span></div>
      <div><strong>Status:</strong> <span id="status">Miasto gotowe</span></div>
    </div>

    <div>
      <div class="panel-title">Sklep</div>
      <div class="shop" id="shop"></div>
    </div>

    <div>
      <div class="panel-title">Garaż</div>
      <div class="garage" id="garage"></div>
    </div>
  </div>

  <div class="viewport">
    <div id="messageBox" class="message">Demo testowa — Kraków</div>
    <div class="hint">W/A/S/D • Shift • E</div>
  </div>

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    sun.position.set(20, 28, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    function setMessage(text){
      state.lastMessage = text;
      msgEl.textContent = text;
      statusEl.textContent = text;
    }

    function updateHud(){
      moneyEl.textContent = state.money + " zł";
      currentVehicleEl.textContent = vehicles[state.currentVehicleId].name;
      modeEl.textContent = state.player.mode === "walk" ? "Pieszo" : "Hulajnoga";
      speedEl.textContent = Math.round(state.player.speed * 1.8) + " km/h";
      statusEl.textContent = state.lastMessage;
    }

    function createScooter(color){
      const group = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color, metalness:0.55, roughness:0.45 });
      const darkMat = new THREE.MeshStandardMaterial({ color:0x111827, metalness:0.4, roughness:0.7 });
      const metalMat = new THREE.MeshStandardMaterial({ color:0xe5e7eb, metalness:0.8, roughness:0.4 });

      const main = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.38, 1.2), bodyMat);
      main.position.y = 0.7;
      group.add(main);

      const deck = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 1.0), darkMat);
      deck.position.y = 0.45;
      group.add(deck);

      const stem = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.8, 0.12), metalMat);
      stem.position.set(1.4, 1.2, 0);
      group.add(stem);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.55, 0.8), bodyMat);
      head.position.set(1.0, 0.95, 0);
      group.add(head);

      const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.25, 18);
      const wheelMat = new THREE.MeshStandardMaterial({ color:0x111827, roughness:0.9 });

      const wheels = [
        [-0.9,0.38,0.72],[0.9,0.38,0.72],
        [-0.9,0.38,-0.72],[0.9,0.38,-0.72]
      ];

      wheels.forEach(([x,y,z]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x,y,z);
        group.add(wheel);
      });

      const light = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.14, 0.4),
        new THREE.MeshStandardMaterial({ color:0xfef3c7, emissive:0xfff6b2, emissiveIntensity:0.9 })
      );
      light.position.set(1.9, 0.92, 0);
      group.add(light);

      group.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      return group;
    }
